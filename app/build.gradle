plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nikon.metronome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nikon.metronome'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            // The debug keystore is generated by AGP, so the APK is directly installable.
        }
        release {
            minifyEnabled false
            // No publishing keystore is shipped with this project. Reuse the
            // AGP-generated debug keystore so the release APK is signed and
            // directly installable; replace this before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig false
    }
}

// Deliberately no external dependencies: the app only uses platform APIs,
// which keeps the build reproducible without extra artifact downloads.
dependencies {
}
